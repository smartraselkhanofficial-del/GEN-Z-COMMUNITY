name: GEN Z COMMUNITY Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore registered debug keystore
        run: |
          if [ -f restore_keystore.sh ]; then
            bash restore_keystore.sh
          elif [ -f debug.keystore.base64 ]; then
            cat debug.keystore.base64 | tr -d '\r\n ' | base64 -d > debug.keystore
          else
            echo "Restoring embedded keystore..."
            echo "" | base64 -d > debug.keystore
          fi
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1|SHA256"

      - name: Build APK with auto-incremented version
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_CODE=$((BUILD_NUM + 10))
          VERSION_NAME="1.0.${BUILD_NUM}"
          gradle --no-daemon assembleDebug -PversionCode=${VERSION_CODE} -PversionName="${VERSION_NAME}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GEN-Z-COMMUNITY-update-v1.0.${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
